<style>
/* Layout: one card at a time; a trail of chosen answers above it lets her jump back to any step */
:root {
  --bg: #f6f2f5;
  --surface: #ffffff;
  --fg: #2b1f29;
  --muted: #6f6170;
  --line: #e6dbe3;
  --accent: #8a3f72;
  --accent-soft: #f3e2ee;
  --accent-fg: #ffffff;
  --leaf: #4f7a62;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1519; --surface: #261e24; --fg: #f3eaf0; --muted: #b5a6b2;
    --line: #3a2f37; --accent: #e08cc4; --accent-soft: #3d2537; --accent-fg: #1b1519; --leaf: #8cc4a3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1519; --surface: #261e24; --fg: #f3eaf0; --muted: #b5a6b2;
  --line: #3a2f37; --accent: #e08cc4; --accent-soft: #3d2537; --accent-fg: #1b1519; --leaf: #8cc4a3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
}
.wrap {
  max-width: 600px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
  display: flex; flex-direction: column; gap: 16px;
}

/* trail */
.topbar { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.back {
  flex: none; font: inherit; font-size: 0.9rem; background: none; border: 0; color: var(--muted); cursor: pointer;
  padding: 6px 8px; margin-left: -8px; border-radius: 8px;
}
.back:hover { color: var(--accent); }
.back:focus-visible { outline: 2px solid var(--accent); }
.ideas {
  flex: none; font-size: 0.8rem; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 5px 10px; border-radius: 99px; border: 1.5px solid var(--line); color: var(--muted);
}
.ideas.full { border-color: var(--leaf); color: var(--leaf); }
.trail { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; padding-block: 2px; }
.trail::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font: inherit; font-size: 0.8rem; font-weight: 600; max-width: 180px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 5px 11px; border-radius: 99px; border: 0; cursor: pointer;
  background: var(--accent-soft); color: var(--accent);
  animation: chipIn .3s ease both;
}
.chip:hover { background: var(--accent); color: var(--accent-fg); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@keyframes chipIn { from { opacity: 0; transform: scale(.8); } }

/* stage + card */
.stage { display: grid; align-items: start; }
.card {
  grid-area: 1 / 1; background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0;
  box-shadow: 0 10px 30px -18px rgba(60, 20, 50, .35);
}
.card.in { animation: slideIn .38s cubic-bezier(.2,.8,.2,1) both; }
.card.in.rev { animation-name: slideInRev; }
.card.out { animation: slideOut .24s ease-in both; pointer-events: none; }
.card.out.rev { animation-name: slideOutRev; }
@keyframes slideIn { from { opacity: 0; transform: translateX(40px) rotate(1.5deg); } to { opacity: 1; transform: none; } }
@keyframes slideInRev { from { opacity: 0; transform: translateX(-40px) rotate(-1.5deg); } to { opacity: 1; transform: none; } }
@keyframes slideOut { to { opacity: 0; transform: translateX(-50px) rotate(-2deg); } }
@keyframes slideOutRev { to { opacity: 0; transform: translateX(50px) rotate(2deg); } }

.topic { font-family: var(--font-display); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--leaf); font-weight: 500; }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.35rem, 5vw, 1.75rem); line-height: 1.2; margin: -8px 0 0; text-wrap: balance; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opts.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt {
  font: inherit; text-align: left; color: var(--fg); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px; cursor: pointer;
  display: flex; align-items: center; gap: 12px; min-width: 0;
  transition: transform .12s, border-color .15s, background .15s;
}
.opts.tiles .opt { flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 14px; min-height: 104px; }
.opts.tiles .opt:last-child:nth-child(odd) { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; }
.opt .ic { font-size: 1.7rem; line-height: 1; }
.opt b {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 0.85rem; border: 1.5px solid var(--line); color: var(--muted);
  transition: background .15s, color .15s, border-color .15s;
}
.opt span.t { font-weight: 600; line-height: 1.3; }
.opt:hover { border-color: var(--accent); }
.opt:active { transform: scale(.97); }
.opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt.sel { background: var(--accent-soft); border-color: var(--accent); }
.opt.sel b { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.opt.pop .ic, .opt.pop b { animation: pop .3s ease; }
@keyframes pop { 50% { transform: scale(1.3); } }

textarea {
  font: inherit; color: var(--fg); background: var(--bg); width: 100%; min-height: 110px; resize: vertical;
  border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px;
}
textarea:focus { outline: none; border-color: var(--accent); }

/* intro + end */
.big { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 8vw, 2.7rem); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.big span { color: var(--accent); }
.card p { margin: 0; color: var(--muted); }
.cake { font-size: 3rem; line-height: 1; animation: wobble 2.4s ease-in-out infinite; transform-origin: 50% 90%; display: inline-block; }
@keyframes wobble { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.btn {
  font: inherit; font-weight: 700; border: 0; border-radius: 99px; cursor: pointer;
  padding: 13px 24px; background: var(--accent); color: var(--accent-fg);
}
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); padding: 9px 18px; font-size: 0.9rem; }
.btn.link { background: none; color: var(--muted); padding: 9px 8px; font-weight: 600; }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.small { font-size: 0.88rem; color: var(--muted); }
.wishlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.wishlist li { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--bg); }
.wishlist .lq { font-size: 0.8rem; color: var(--muted); }
.wishlist .la { font-weight: 700; }
.hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.hearts span { position: absolute; bottom: -40px; animation: rise 2.8s ease-out forwards; }
@keyframes rise { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }

@media (max-width: 380px) { .opts.tiles { grid-template-columns: 1fr; } .opts.tiles .opt { min-height: 0; flex-direction: row; align-items: center; } }
@media (prefers-reduced-motion: reduce) {
  .card.in, .card.out, .opt.pop .ic, .opt.pop b, .hearts span, .cake, .chip { animation: none !important; }
  .card.out { opacity: 0; }
}
</style>
</head>

    [, "Etwas Schönes für die Wohnung"], [, "Etwas für die Küche"], [, "Kleidung, Schmuck oder Kosmetik"], [, "Eine Reise oder ein Erlebnis"],

    [, "Ich mag es gemütlich zu Hause"], [, "Ich probiere gerne Neues aus"], [, "Familie geht mir über alles"], [, "Ich genieße gutes Essen und Trinken"] ] },

  /* Abschluss */
  more: { topic: "Fast fertig", q: "Gibt es noch etwas, worüber du dich freuen würdest?", opts: [
    ["➕", "Ja, ich habe noch eine Idee", "start2"], ["✅", "Nein, das war's", "konkret"] ] },
  konkret: { topic: "Letzte Frage", type: "text", q: "Gibt es etwas, das dir in letzter Zeit besonders gefallen hat?", hint: "Zum Beispiel: eine Lampe im Möbelhaus, ein Duft, ein Ort … Du kannst das auch leer lassen.", next: "end" }
};

/* ---------- State ---------- */
const KEY = "mama-wish-v4";
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const stage = $("stage");
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

let hist = [];      // [{node, label, value}]
let cur = "intro";  // "intro" | node id | "end"
let busy = false;

try {
  const s = JSON.parse(localStorage.getItem(KEY) || "null");
  if (s && Array.isArray(s.hist) && (N[s.cur] || s.cur === "end")) { hist = s.hist; }
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ hist, cur })); } catch (e) {} };

/* ---------- Rendering ---------- */
function topbar() {
  const show = cur !== "intro";
  $("topbar").hidden = !show;
  if (!show) return;
  $("trail").innerHTML = hist.map((h, i) =>
    h.value ? `<button class="chip" type="button" data-i="${i}" title="Zurück zu: ${esc(h.value)}">${esc(h.value)}</button>` : ""
  ).join("");
  $("trail").querySelectorAll(".chip").forEach(c => c.onclick = () => jump(+c.dataset.i));
  $("trail").scrollLeft = 99999;
  const c = Math.min(ideaCount(), GOAL);
  $("ideas").textContent = `💡 ${c} / ${GOAL}`;
  $("ideas").title = `${c} von mindestens ${GOAL} Ideen`;
  $("ideas").classList.toggle("full", c >= GOAL);
}

function build() {
  const card = document.createElement("div");
  card.className = "card";

  if (cur === "intro") {
    const resume = hist.length > 0;
    card.innerHTML = `
      <div><span class="cake" aria-hidden="true">✨</span></div>
      <h1 class="big">Ein bisschen <span>über dich</span></h1>
      <p>Ein kleines Spiel mit ein paar Fragen. Tippe einfach spontan an, was dir gefällt. Jede Antwort führt zur nächsten Frage, und du kannst jederzeit zurück. Sammle mindestens 4 Dinge, die dir Freude machen würden.</p>
      <div class="row">
        <button class="btn" id="start" type="button">${resume ? "Weitermachen" : "Los geht's"}</button>
        ${resume ? '<button class="btn link" id="fresh" type="button">Neu starten</button>' : ""}
      </div>`;
    card.querySelector("#start").onclick = () => {
      if (resume) { const last = hist[hist.length - 1]; go(nextOf(last), 1); }
      else go("start", 1);
    };
    const f = card.querySelector("#fresh");
    if (f) f.onclick = () => { hist = []; save(); go("start", 1); };
    return card;
  }

  if (cur === "end") {
    const items = hist.filter(h => h.value && h.node !== "more");
    card.innerHTML = `
      <div><span class="cake" aria-hidden="true">💐</span></div>
      <h1 class="big">Danke <span>dir!</span> ❤️</h1>
      <p>Das war's schon. Kopiere deine Antworten und schick sie mir per WhatsApp oder Nachricht.</p>
      <ul class="wishlist">${items.map(h => `<li><span class="lq">${esc(h.q || N[h.node].q)}</span><span class="la">${esc(h.value)}</span></li>`).join("")}</ul>
      <div class="row"><button class="btn" id="copy" type="button">Antworten kopieren</button><span class="small" id="copied" aria-live="polite"></span></div>
      <div class="row"><button class="btn ghost" id="edit" type="button">← Etwas ändern</button><button class="btn link" id="reset" type="button">Neu starten</button></div>`;
    card.querySelector("#copy").onclick = () => copy(items, card);
    card.querySelector("#edit").onclick = () => back();
    card.querySelector("#reset").onclick = () => { hist = []; save(); go("intro", -1); };
    return card;
  }

  const n = N[cur];
  if (n.type === "text") {
    card.innerHTML = `
      <div class="topic">${esc(n.topic)}</div>
      <h2>${esc(n.q)}</h2>
      <p>${esc(n.hint)}</p>
      <label class="small" for="free" hidden>Deine Antwort</label>
      <textarea id="free" placeholder="Schreib hier, was dir einfällt …"></textarea>
      <div class="row"><button class="btn" id="ok" type="button">Fertig</button><button class="btn link" id="skip" type="button">Überspringen</button></div>`;
    const ta = card.querySelector("#free");
    card.querySelector("#ok").onclick = () => answer(ta.value.trim(), n.next);
    card.querySelector("#skip").onclick = () => answer("", n.next);
    return card;
  }

  const tiles = n.opts.some(o => o[0]);
  card.innerHTML = `
    <div class="topic">${esc(n.topic)}</div>
    <h2 id="qh">${esc(typeof n.q === "function" ? n.q() : n.q)}</h2>
    <div class="opts${tiles ? " tiles" : ""}" role="radiogroup" aria-labelledby="qh">
      ${n.opts.map((o, i) => `<button type="button" class="opt" role="radio" aria-checked="false" data-i="${i}">
        ${o[0] ? `<span class="ic" aria-hidden="true">${o[0]}</span>` : `<b>${"ABCDEFGH"[i]}</b>`}
        <span class="t">${esc(o[1])}</span></button>`).join("")}
    </div>`;
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(b));
  return card;
}

function go(next, dir) {
  if (busy) return;
  const old = stage.querySelector(".card");
  cur = next; save();
  const card = build();
  topbar();
  const mount = () => {
    stage.innerHTML = "";
    card.classList.add("in"); if (dir < 0) card.classList.add("rev");
    stage.appendChild(card);
    const f = card.querySelector("textarea, .opt, .btn");
    if (f) f.focus({ preventScroll: true });
    window.scrollTo({ top: 0 });
    if (cur === "end") hearts();
    busy = false;
  };
  if (old && !reduced) {
    busy = true;
    old.classList.add("out"); if (dir < 0) old.classList.add("rev");
    setTimeout(mount, 230);
  } else mount();
}

function nextOf(h) {
  if (h.next) return h.next;
  return "start";
}

function pick(btn) {
  if (busy) return;
  const n = N[cur], o = n.opts[+btn.dataset.i];
  btn.closest(".opts").querySelectorAll(".opt").forEach(x => { x.classList.remove("sel", "pop"); x.setAttribute("aria-checked", "false"); });
  btn.classList.add("sel", "pop"); btn.setAttribute("aria-checked", "true");
  busy = true;
  const next = o[2] || n.next;
  // A concrete wish: an answer on an item question (unless it only opens a more specific one),
  // or a category tile that is already specific enough to skip straight to the follow-ups.
  const item = n.item ? !(o[2] && N[o[2]] && N[o[2]].item) : ["kqual", "more", "mitwem"].includes(o[2]);
  const q = typeof n.q === "function" ? n.q() : n.q;
  setTimeout(() => { busy = false; answer(o[1], next, item, q); }, reduced ? 100 : 380);
}

const GOAL = 4;
const ideaCount = () => hist.filter(h => h.item).length;

function answer(value, next, item = false, q = "") {
  hist.push({ node: cur, value, next, item, q });
  if (next === "more" && ideaCount() < GOAL) { next = "start2"; hist[hist.length - 1].next = next; }
  go(next, 1);
}

function back() {
  if (!hist.length) { go("intro", -1); return; }
  const h = hist.pop();
  go(h.node, -1);
}
function jump(i) {
  const h = hist[i];
  hist = hist.slice(0, i);
  go(h.node, -1);
}

function copy(items, card) {
  const text = "Meine Antworten ✨\n\n" + items.map(h => `• ${h.q || N[h.node].q}\n  → ${h.value}`).join("\n");
  const msg = card.querySelector("#copied");
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(card.querySelector(".wishlist"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    msg.textContent = "Text ist markiert, jetzt kopieren.";
  };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = "Kopiert!"; }, fallback); }
  catch (e) { fallback(); }
}

function hearts() {
  if (reduced) return;
  const h = $("hearts");
  for (let i = 0; i < 20; i++) {
    const s = document.createElement("span");
    s.textContent = ["❤️", "🎈", "💕", "🎉"][i % 4];
    s.style.left = Math.random() * 100 + "%";
    s.style.animationDelay = Math.random() * 0.9 + "s";
    s.style.fontSize = 16 + Math.random() * 20 + "px";
    h.appendChild(s);
    setTimeout(() => s.remove(), 4000);
  }
}

$("back").onclick = back;
document.addEventListener("keydown", e => {
  if (!N[cur] || N[cur].type === "text" || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  let idx = "12345678".indexOf(k);
  if (idx < 0) idx = "ABCDEFGH".indexOf(k);
  const b = idx >= 0 ? stage.querySelectorAll(".opt")[idx] : null;
  if (b) pick(b);
  else if (e.key === "Backspace" || e.key === "ArrowLeft") back();
});

go("intro", 1);
</script>
